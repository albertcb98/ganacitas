<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Olvidaste tu contraseña? | GanaCitas</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="container narrow">
    <div class="card p24">
      <h1 class="h2">Restablecer contraseña</h1>
      <p class="muted">
        Introduce tu email y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form id="forgotForm" style="margin-top:16px">
        <div class="field">
          <label>Email</label>
          <input name="email" type="email" autocomplete="email" required />
        </div>

        <button class="btn primary" type="submit">
          Enviar enlace
        </button>
      </form>

      <div style="margin-top:14px">
        <a class="muted" href="/login/">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(()=> t.style.display="none", 4000);
    }

    async function postJSON(url, payload){
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return r.json().catch(()=> ({}));
    }

    document.getElementById("forgotForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());

      try{
        await postJSON("/api/auth/forgot-password", payload);
        showToast("Si el email existe, te hemos enviado un enlace de recuperación.");
        e.target.reset();
      }catch{
        showToast("Error al enviar el enlace. Inténtalo de nuevo.");
      }
    });
  </script>
</body>
</html>

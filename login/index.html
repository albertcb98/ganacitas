<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión | GanaCitas</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="container narrow">
    <div class="card p24">
      <h1 class="h2">Iniciar sesión</h1>
      <p class="muted">Accede a tu panel.</p>

      <!-- Google first -->
      <a class="btn primary" id="googleBtn" href="#">Continuar con Google</a>
      <p class="muted" style="margin-top:10px">o inicia sesión con email</p>

      <form id="loginForm" style="margin-top:14px">
        <div class="field">
          <label>Email</label>
          <input
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input
            name="password"
            type="password"
            minlength="8"
            autocomplete="current-password"
            required
          />
        </div>

        <div style="margin-top:10px">
          <a class="muted" href="/forgot-password/">
            ¿Has olvidado tu contraseña?
          </a>
        </div>

        <button class="btn" type="submit">Entrar</button>
      </form>

      <div style="margin-top:12px">
        <a class="muted" id="registerLink" href="/register/">
          ¿No tienes cuenta? Crear cuenta
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function showToast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(
        () => t.style.display = "none",
        3500
      );
    }

    function qs(){
      return new URLSearchParams(window.location.search);
    }

    function safeNext(nextMaybe){
      if(!nextMaybe || typeof nextMaybe !== "string") return "/dashboard/";
      if(!nextMaybe.startsWith("/")) return "/dashboard/";
      return nextMaybe;
    }

    function buildNextWithPlanAndAutopay(){
      const p = qs();
      const next = safeNext(p.get("next") || "/dashboard/");
      const plan = p.get("plan");
      const autopay = p.get("autopay");

      const u = new URL(next, window.location.origin);
      if(plan) u.searchParams.set("plan", plan);
      if(autopay) u.searchParams.set("autopay", autopay);

      return u.pathname + u.search + u.hash;
    }

    async function postJSON(url, payload){
      const r = await fetch(url, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await r.json().catch(() => ({}));

      if(!r.ok){
        if(r.status === 401){
          throw new Error("Contraseña incorrecta");
        }
        throw new Error(data?.error || "Error");
      }

      return data;
    }

    (function initLinks(){
      const nextFinal = buildNextWithPlanAndAutopay();

      const googleBtn = document.getElementById("googleBtn");
      if(googleBtn){
        googleBtn.href =
          `/api/auth/google/start?next=${encodeURIComponent(nextFinal)}`;
      }

      const registerLink = document.getElementById("registerLink");
      if(registerLink){
        registerLink.href =
          `/register/?next=${encodeURIComponent(nextFinal)}`;
      }
    })();

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const btn = e.target.querySelector("button");
        btn.disabled = true;

        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());

        try{
          await postJSON("/api/auth/login", payload);
          window.location.href = buildNextWithPlanAndAutopay();
        }catch(err){
          showToast(err?.message || "Error");
          btn.disabled = false;
        }
      });
  </script>
</body>
</html>
